<script>

/* ------------------------------------------------------------------ payload

const DATA = /*__DATA__*/null;

/* ------------------------------------------------------------------ helpers */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

const f = (v, d) => (v === null || v === undefined || Number.isNaN(v)) ? "--" : Number(v).toFixed(d);
const f2 = v => f(v, 2), f3 = v => f(v, 3), f4 = v => f(v, 4), f5 = v => f(v, 5);
const sg = (v, d) => (v === null || v === undefined) ? "--" : (v >= 0 ? "+" : "\u2212") + Math.abs(v).toFixed(d);
const pct = (v, d) => (v === null || v === undefined) ? "--" : (v * 100).toFixed(d === undefined ? 1 : d) + "%";
const pp = (v, d) => (v === null || v === undefined) ? "--" : v.toFixed(d === undefined ? 2 : d) + " pp";
const int = v => (v === null || v === undefined) ? "--" : Math.round(v).toLocaleString("en-US");
const mult = (v, d) => (v === null || v === undefined) ? "--" : v.toFixed(d === undefined ? 2 : d) + "\u00d7";

function sci(v, d) {
  if (v === null || v === undefined) return "--";
  if (v === 0) return "0";
  if (v >= 0.001) return Number(v).toFixed(d === undefined ? 4 : d);
  const e = Math.floor(Math.log10(Math.abs(v)));
  return (v / Math.pow(10, e)).toFixed(1) + "\u00d710" + sup(e);
}
function sup(n) {
  const m = { "-": "\u207b", "0": "\u2070", "1": "\u00b9", "2": "\u00b2", "3": "\u00b3",
              "4": "\u2074", "5": "\u2075", "6": "\u2076", "7": "\u2077", "8": "\u2078", "9": "\u2079" };

}
function dur(sec) {
  if (sec === null || sec === undefined) return "--";
  if (sec < 90) return Math.round(sec) + " s";
  const m = sec / 60;

  return (m / 60).toFixed(1) + " h";
}
const sum = a => a.reduce((x, y) => x + y, 0);
const mean = a => a.length ? sum(a) / a.length : null;
const med = a => { const s = a.slice().sort((x, y) => x - y); const n = s.length;

   by viewBox, so the charts stay crisp at any zoom and need no resize handling. */
const NS = "http://www.w3.org/2000/svg";
function svg(w, h, cls) {
  const e = document.createElementNS(NS, "svg");
  e.setAttribute("viewBox", "0 0 " + w + " " + h);
  e.setAttribute("class", "chart " + (cls || ""));
  e.setAttribute("preserveAspectRatio", "none");
  return e;
}
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;

}
function mount(id, node) { const h = $("#" + id); if (h) { h.innerHTML = ""; h.appendChild(node); } }

/* Segmented-control wiring. `attr` is the data attribute holding the mode. */
function seg(id, attr, onPick) {
  const host = $("#" + id);
  if (!host) return;
  const btns = $$("button", host);
  btns.forEach(b => b.addEventListener("click", () => {
    btns.forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    onPick(b.getAttribute(attr), b);
  }));
  const on = host.querySelector("button.on") || btns[0];
  if (on) { on.classList.add("on"); onPick(on.getAttribute(attr), on); }
}

/* ------------------------------------------------------------------ shorthands */

const SHP = DATA.shap;

const PAIR_RHO = Object.values(STB.pairwise_spearman);

function selGapPP(row) {
  const r = row.groups.map(g => g.selection_rate);
  return (Math.max.apply(null, r) - Math.min.apply(null, r)) * 100;
}

/* ------------------------------------------------------------------ scalar map
   Keys match data-v="..." in the parts. A key referenced in markup but absent
   here renders as "?!" rather than silently blank, so omissions are visible. */
const V = {};

/* -- dataset and environment -- */
V["prevalence-pct"]   = pct(PREV, 2);
V["n-clean"]          = int(DATA.final.bayes_floor.n_rows);
V["n-train"]          = int(DATA.oof.n);
V["n-test"]           = int(DATA.final.n_test);
V["n-test-pos"]       = int(DATA.final.n_test_pos);
V["n-test-neg"]       = int(DATA.final.n_test - DATA.final.n_test_pos);
V["oof-n"]            = int(DATA.oof.n);
V["oof-pos"]          = int(DATA.oof.pos);

/* -- complexity ladder -- */
V["majority-acc"]     = pct(LAD.rung0_majority["accuracy_at_0.5"], 2);
V["rung0-pr"]         = f4(LAD.rung0_majority.pr);
V["rung1-auc"]        = f4(LAD.rung1_pay0_rule.auc);
V["rung1b-auc"]       = f4(LAD.rung1b_pay0_score.auc);
V["rung1b-pr"]        = f4(LAD.rung1b_pay0_score.pr);
V["rung1-gap"]        = sg(LAD.rung1b_pay0_score.auc - LAD.rung1_pay0_rule.auc, 4);
V["rung2-auc"]        = f4(LAD.rung2_logistic.auc);

V["rung4-auc"]        = f4(LAD.rung4_forest.auc);
V["rung5-auc"]        = f4(LAD.rung5_xgb_default.auc);
V["rung6-auc"]        = f4(LAD.rung6_xgb_tuned.auc);
V["rung6-sd"]         = f4(LAD.rung6_xgb_tuned.sd);
V["rung6-acc"]        = pct(LAD.rung6_xgb_tuned["accuracy_at_0.5"], 2);
V["lad-pr6"]          = f4(LAD.rung6_xgb_tuned.pr);
V["lad-pr-rel"]       = mult(LAD.rung6_xgb_tuned.pr / PREV);
V["lad-gain-breadth"] = sg(LAD.rung2_logistic.auc - LAD.rung1b_pay0_score.auc, 4);
V["lad-gain-nonlin"]  = sg(LAD.rung3_tree.auc - LAD.rung2_logistic.auc, 4);
V["lad-gain-bag"]     = sg(LAD.rung4_forest.auc - LAD.rung3_tree.auc, 4);
V["lad-gain-boost"]   = sg(LAD.rung5_xgb_default.auc - LAD.rung4_forest.auc, 4);
V["lad-gain-total"]   = sg(LAD.rung6_xgb_tuned.auc - LAD.rung1_pay0_rule.auc, 4);
V["lad-gain-total-sd"] = f4(LAD.rung6_xgb_tuned.sd);

/* -- tuning -- */
V["tuning-gain"]      = sg(TUN.gain, 4);
V["tune-trials"]      = int(TUN.n_trials);
V["tune-complete"]    = int(TUN.n_complete);
V["tune-pruned"]      = int(TUN.n_pruned);

V["tune-pooled-sd"]   = f4(TUN.pooled_sd);
V["n-trees"]          = int(TUN.n_trees);
if (TUN.study) {
  V["tune-lo"]        = f4(TUN.study.lo);
  V["tune-hi"]        = f4(TUN.study.hi);
  V["tune-span"]      = f4(TUN.study.hi - TUN.study.lo);
  V["tune-med-gap"]   = f4(TUN.study.hi - TUN.study.median);
} else {
  V["tune-lo"] = V["tune-hi"] = V["tune-span"] = V["tune-med-gap"] = "n/a";
}
V["bp-max_depth"]        = String(BP.max_depth);
V["bp-eta"]              = f4(BP.eta);
V["bp-min_child_weight"] = f2(BP.min_child_weight);
V["bp-subsample"]        = f3(BP.subsample);

V["bp-reg_lambda"]       = f2(BP.reg_lambda);
V["bp-reg_alpha"]        = sci(BP.reg_alpha, 4);

/* -- imbalance -- */
V["imb-a-brier"]      = f5(IMB.A_baseline.brier);
V["imb-a-cost"]       = int(IMB.A_baseline.oof_cost_r6);
V["imb-a-rec"]        = f4(IMB.A_baseline.oof_recall);
V["imb-b-rec"]        = f4(IMB.B_threshold.oof_recall);
V["imb-b-cost"]       = int(IMB.B_threshold.oof_cost_r6);
V["imb-b-tau"]        = f4(IMB.B_threshold.oof_threshold);
V["imb-c-brier"]      = f5(IMB.C_spw.brier);
V["imb-cp-cost"]      = int(IMB.C_spw_threshold.oof_cost_r6);
V["imb-cp-tau"]       = f4(IMB.C_spw_threshold.oof_threshold);
V["imb-ac-auc-gap"]   = sg(IMB.C_spw.auc - IMB.A_baseline.auc, 5);
V["imb-ad-auc-gap"]   = sg(IMB.D_smote.auc - IMB.A_baseline.auc, 5);
V["imb-bcp-cost-gap"] = int(Math.abs(IMB.C_spw_threshold.oof_cost_r6 - IMB.B_threshold.oof_cost_r6));
V["imb-d-auc"]        = f4(IMB.D_smote.auc);
V["imb-d-brier"]      = f5(IMB.D_smote.brier);

/* -- calibration -- */
V["cal-a-auc"]        = f4(CAL.A_spw1_raw.auc);
V["cal-a-brier"]      = f5(CAL.A_spw1_raw.brier);
V["cal-a-ece"]        = f4(CAL.A_spw1_raw.ece);
V["cal-a-meanp"]      = f4(CAL.A_spw1_raw.mean_predicted);
V["cal-c-auc"]        = f4(CAL.C_spw_raw.auc);
V["cal-c-brier"]      = f5(CAL.C_spw_raw.brier);
V["cal-c-ece"]        = f4(CAL.C_spw_raw.ece);
V["cal-c-meanp"]      = f4(CAL.C_spw_raw.mean_predicted);

V["cost-r6-prec"]     = f4(CST.r6_flat.precision);
V["cost-r1-prec"]     = f4(CST.r1_flat.precision);

/* -- SHAP -- */
V["shap-n"]           = int(SHP.explain_n);

V["shap-limit-signed"] = sg(SHT.LIMIT_BAL.mean_signed, 4);

V["shap-group-bill"]  = pct(SHP.group_share.bill, 1);

V["shap-tp-p"]        = pct(SHP.waterfall.true_positive.proba, 1);
V["shap-fn-row"]      = int(SHP.waterfall.false_negative.row);
V["shap-fn-p"]        = pct(SHP.waterfall.false_negative.proba, 1);

V["sp-shap1"]         = sg(SHP.pay0["1"].mean_shap_logodds, 3);

/* -- stability and importance agreement -- */
V["stab-seeds"]       = STB.seeds.join(", ");
V["stab-topk"]        = String(STB.top_k);

V["stab-jac-mean"]    = f4(STB.jaccard_mean);
V["stab-jac-min"]     = f4(Math.min.apply(null, PAIR_JAC));
V["stab-runtime"]     = dur(M.runtimes.exp12_stability);
V["ag-cover-weight"]  = f2(STB.agreement.cover.weight);
V["ag-shap-perm"]     = f2(STB.agreement.shap.permutation);
V["ag-shap-gain"]     = f2(STB.agreement.shap.gain);

/* -- fairness -- */
V["fair-tau"]         = f4(DATA.fairness.threshold);
V["fair-n-nodemo"]    = String(DATA.fairness.n_no_demo);
V["fair-auc-full"]    = f4(DATA.fairness.oof_auc.full);
V["fair-auc-nodemo"]  = f4(DATA.fairness.oof_auc.no_demographics);
V["fair-auc-delta"]   = sg(DATA.fairness.oof_auc.no_demographics - DATA.fairness.oof_auc.full, 4);
V["fair-auc-drop"]    = f4(Math.abs(DATA.fairness.oof_auc.full - DATA.fairness.oof_auc.no_demographics));
V["fair-proxy-survives"] = pct(DATA.fairness.proxy_recovery_sex, 1);
V["fair-proxy-removed"]  = pct(1 - DATA.fairness.proxy_recovery_sex, 1);
V["fair-proxy-removed-signed"] = pp(selGapPP(FAI.no_demographics_SEX) - selGapPP(FAI.full_SEX));
V["fair-sex-obs"]     = pp(FAI.full_SEX.observed_gap_pp);
V["fair-sex-sel"]     = pp(selGapPP(FAI.full_SEX));
V["fair-sex-sel-nodemo"] = pp(selGapPP(FAI.no_demographics_SEX));

V["fair-sex-recgap"]  = f4(FAI.full_SEX.recall_gap);
V["fair-sex-recgap-nodemo"] = f4(FAI.no_demographics_SEX.recall_gap);
V["fair-sex-aucgap"]  = f4(FAI.full_SEX.auc_gap);
V["fair-sex-fprgap"]  = f4(FAI.full_SEX.fpr_gap);
V["fair-sex-selratio"] = f3(FAI.full_SEX.sel_ratio);

V["fair-edu-sel"]     = pp(selGapPP(FAI.full_EDUCATION));
V["fair-edu-ratio"]   = mult(selGapPP(FAI.full_EDUCATION) / FAI.full_EDUCATION.observed_gap_pp);
V["fair-edu-recgap"]  = f4(FAI.full_EDUCATION.recall_gap);
V["fair-edu-recgap-nodemo"] = f4(FAI.no_demographics_EDUCATION.recall_gap);
V["fair-edu-aucgap"]  = f4(FAI.full_EDUCATION.auc_gap);
V["fair-edu-aucgap-nodemo"] = f4(FAI.no_demographics_EDUCATION.auc_gap);
V["fair-mar-recgap"]  = f4(FAI.full_MARRIAGE.recall_gap);
V["fair-age-recgap"]  = f4(FAI.full_AGE_BAND.recall_gap);

/* -- final, robustness, DeLong -- */
V["fin-tau"]          = f4(FIN.xgb_tuned.threshold);
V["fin-auc"]          = f5(FIN.xgb_tuned.roc_auc);
V["fin-pr"]           = f5(FIN.xgb_tuned.pr_auc);
V["fin-brier"]        = f5(FIN.xgb_tuned.brier);
V["fin-recall"]       = f4(FIN.xgb_tuned.recall);
V["fin-prec"]         = f4(FIN.xgb_tuned.precision);
V["fin-fp"]           = int(FIN.xgb_tuned.fp);
V["fin-cost"]         = int(FIN.xgb_tuned.total_cost_r6);
V["fin-base-fp"]      = int(FIN.rung1_pay0_baseline.fp);
V["fin-cv-gap"]       = sg(LAD.rung6_xgb_tuned.auc - FIN.xgb_tuned.roc_auc, 4);
V["fin-iso-auc"]      = f5(FIN.xgb_tuned_isotonic.roc_auc);
V["fin-spw-auc"]      = f5(FIN.xgb_tuned_spw.roc_auc);
V["fin-spw-auc-base"] = f5(FIN.xgb_tuned.roc_auc);
V["fin-spw-brier"]    = f5(FIN.xgb_tuned_spw.brier);
V["fin-spw-tau"]      = f4(FIN.xgb_tuned_spw.threshold);
V["nopay0-test"]      = f5(FIN.xgb_tuned_no_pay0.roc_auc);
V["fin-seed-mean"]    = f5(mean(SEEDS_AUC));
V["fin-seed-sd"]      = f5(DATA.final.seed_sd);
V["fin-seed-2sd"]     = f5(2 * DATA.final.seed_sd);
V["fin-seed-min"]     = f5(Math.min.apply(null, SEEDS_AUC));
V["fin-seed-max"]     = f5(Math.max.apply(null, SEEDS_AUC));
V["fin-seed-range"]   = f5(Math.max.apply(null, SEEDS_AUC) - Math.min.apply(null, SEEDS_AUC));
V["fin-seed-mean9"]   = (function () {
  const lo = Math.min.apply(null, SEEDS_AUC);
  const rest = SEEDS_AUC.filter((v, i) => i !== SEEDS_AUC.indexOf(lo));
  return f5(mean(rest));
})();
V["fin-seed-brier-max"] = f5(Math.max.apply(null, SEEDS_BRIER));
V["fin-seed-brier-typ"] = f5(med(SEEDS_BRIER));
V["dl-rule-diff"]     = f4(DL.tuned_vs_pay0_rule.diff);
V["dl-rule-ci"]       = "[" + f4(DL.tuned_vs_pay0_rule.ci95[0]) + ", " + f4(DL.tuned_vs_pay0_rule.ci95[1]) + "]";
V["dl-rule-p"]        = sci(DL.tuned_vs_pay0_rule.p_value);
V["dl-def-diff"]      = f4(DL.tuned_vs_library_defaults.diff);
V["dl-def-p"]         = sci(DL.tuned_vs_library_defaults.p_value);
V["dl-nopay0-diff"]   = f4(DL.tuned_vs_no_pay0.diff);
V["dl-nopay0-p"]      = sci(DL.tuned_vs_no_pay0.p_value);
V["dl-ratio"]         = mult(DL.tuned_vs_pay0_rule.diff / DL.tuned_vs_library_defaults.diff, 1);

/* -- PAY_0 ablation and the ceiling -- */
const PA = DATA.final.pay0_ablation;
V["pay0-cv-full"]     = f4(PA.cv_roc_auc_full);
V["pay0-cv-nopay0"]   = f4(PA.cv_roc_auc_no_pay0);
V["pay0-cv-delta"]    = sg(PA.cv_roc_auc_no_pay0 - PA.cv_roc_auc_full, 4);
V["pay0-delta-cv"]    = sg(PA.cv_roc_auc_no_pay0 - PA.cv_roc_auc_full, 4);
V["pay0-test-delta"]  = sg(FIN.xgb_tuned_no_pay0.roc_auc - FIN.xgb_tuned.roc_auc, 4);
/* Magnitude twins. Prose that says "costs X" must not then print a minus sign:
   the direction is already carried by the verb, so printing it twice reads as
   a gain. Signed keys stay for table cells, where the sign is the information. */
V["pay0-cv-drop"]     = f4(Math.abs(PA.cv_roc_auc_full - PA.cv_roc_auc_no_pay0));
V["pay0-test-drop"]   = f4(Math.abs(FIN.xgb_tuned.roc_auc - FIN.xgb_tuned_no_pay0.roc_auc));
V["pay0-delta-sd"]    = mult(Math.abs(PA.cv_roc_auc_full - PA.cv_roc_auc_no_pay0) / PA.cv_sd_full, 1);
V["pay0-paired-mean"] = f5(PA.paired_fold_test.mean_delta);
V["pay0-paired-sd"]   = f5(PA.paired_fold_test.sd);
V["pay0-paired-t"]    = f(PA.paired_fold_test.t, 1);
V["pay0-paired-p"]    = sci(PA.paired_fold_test.p_value);
V["bayes-dup-rows"]   = int(DATA.final.bayes_floor.contradictory_rows);
V["bayes-groups"]     = int(DATA.final.bayes_floor.contradictory_groups);
V["bayes-share"]      = DATA.final.bayes_floor.contradictory_share_pct.toFixed(2) + "%";

/* -- feature studies -- */
V["enc-native"]       = f4(ENC.native_int.auc);
V["enc-onehot"]       = f4(ENC.one_hot.auc);
V["enc-onehot-n"]     = String(ENC.one_hot.n_features);
V["enc-cat"]          = f4(ENC.native_categorical.auc);

V["eng-delta-plus"]   = sg(ENG.raw_plus_engineered.auc - ENG.raw_23.auc, 5);
V["eng-delta-only"]   = sg(ENG.engineered_only.auc - ENG.raw_23.auc, 5);
V["eng-drop-only"]    = f5(Math.abs(ENG.raw_23.auc - ENG.engineered_only.auc));
V["eng-pr-raw"]       = f4(ENG.raw_23.pr);
V["eng-pr-only"]      = f4(ENG.engineered_only.pr);
V["eng-rfe-auc"]      = f4(ENG.rfe_top23.auc);
V["eng-rfe-n"]        = String(ENG.rfe_top23.n_features);
V["grp-loo-demo"]     = f4(AB.groups.loo.demographic);
V["grp-loo-pay"]      = f4(AB.groups.loo.pay_status);
V["grp-loo-bill"]     = f4(AB.groups.loo.bill);
V["grp-only-demo"]    = f4(AB.groups.only.demographic);
V["grp-only-pay"]     = f4(AB.groups.only.pay_status);
V["grp-only-bill"]    = f4(AB.groups.only.bill);
V["grp-onlypay"]      = f4(AB.groups.only.pay_status);
V["rec-k1"]           = f4(REC.k1_months.auc);

V["rec-total-gain"]   = sg(REC.k6_months.auc - REC.k1_months.auc, 4);
V["lc-f10"]           = f4(LRN["frac_0.10"].auc);
V["lc-f50"]           = f4(LRN["frac_0.50"].auc);

V["lc-gap-first"]     = f4(LRN["frac_0.10"].gap_train_minus_val);
V["lc-gap-last"]      = f4(LRN["frac_1.00"].gap_train_minus_val);
V["lc-marg-last"]     = sg(LRN["frac_1.00"].auc - LRN["frac_0.75"].auc, 4);
V["lc-sd-last"]       = f4(LRN["frac_1.00"].sd);

/* Fill every placeholder. Buttons carrying data-v are segmented-control modes,
   not value slots, so they are skipped. */
function injectScalars() {
  const missing = [];
  $$("[data-v]").forEach(node => {
    if (node.tagName === "BUTTON") return;
    const k = node.getAttribute("data-v");
    if (Object.prototype.hasOwnProperty.call(V, k)) {
      node.textContent = V[k];
    } else {
      node.textContent = "?!";
      node.style.color = "var(--bad)";
      missing.push(k);
    }
  });
  if (missing.length) console.warn("guide: unmapped data-v keys", missing);
}
