<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>XGBoost on Credit-Card Defaults — Study Guide</title>
<style>
/* ===================================================================== tokens */
:root{
  --bg:#0e1116; --bg2:#151a21; --bg3:#1c232c; --bd:#283139; --bd2:#39444f;
  --ink:#e6edf3; --ink2:#aebac6; --ink3:#7d8b99;
  --acc:#4c9aff; --acc2:#7ee3c0; --warn:#ffb454; --bad:#ff7b72; --good:#56d364;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sb:280px; --rad:10px;
  --shadow:0 2px 14px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#fbfcfd; --bg2:#fff; --bg3:#f2f5f8; --bd:#dde3ea; --bd2:#c3ccd6;
  --ink:#1b2430; --ink2:#48565f; --ink3:#6b7986;
  --acc:#0b5fd0; --acc2:#0d8a6a; --warn:#9a6200; --bad:#c0362c; --good:#1a7f37;
  --shadow:0 2px 12px rgba(16,32,48,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.68 var(--sans);
  -webkit-font-smoothing:antialiased;
}

/* ==================================================================== layout */
#shell{display:flex; min-height:100vh}
#sidebar{
  width:var(--sb); flex:0 0 var(--sb); position:sticky; top:0; height:100vh;
  overflow-y:auto; background:var(--bg2); border-right:1px solid var(--bd);
  padding:18px 0 40px;
}
#main{flex:1; min-width:0; padding:0 0 140px}
.wrap{max-width:860px; margin:0 auto; padding:0 32px}

/* =================================================================== sidebar */
.brand{padding:0 18px 14px; border-bottom:1px solid var(--bd); margin-bottom:12px}
.brand h1{font-size:15px; margin:0 0 4px; letter-spacing:-.01em}
.brand p{margin:0; font-size:11.5px; color:var(--ink3); line-height:1.45}
.navsearch{padding:0 14px 12px}
.navsearch input{
  width:100%; padding:7px 10px; font:12.5px var(--sans); color:var(--ink);
  background:var(--bg3); border:1px solid var(--bd); border-radius:7px;
}
.navsearch input:focus{outline:none; border-color:var(--acc)}
nav ol{list-style:none; margin:0; padding:0 10px}
nav li{margin:1px 0}
nav a{
  display:block; padding:5px 10px; font-size:12.8px; color:var(--ink2);
  text-decoration:none; border-radius:6px; border-left:2px solid transparent;
  line-height:1.4;
}
nav a:hover{background:var(--bg3); color:var(--ink)}
nav a.active{background:color-mix(in srgb,var(--acc) 16%,transparent); color:var(--ink);
  border-left-color:var(--acc); font-weight:600}
nav a .num{color:var(--ink3); font:11px var(--mono); margin-right:7px}
nav a.sub{padding-left:30px; font-size:12px}
nav .grp{
  padding:13px 12px 5px; font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink3); font-weight:700;
}
.navhide{display:none !important}

/* ==================================================================== topbar */
#topbar{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--bd);
  display:flex; align-items:center; gap:10px; padding:9px 32px;
}
#crumb{font-size:12.5px; color:var(--ink3); flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.btn{
  background:var(--bg3); border:1px solid var(--bd); color:var(--ink2);
  border-radius:7px; padding:5px 11px; font:12px var(--sans); cursor:pointer;
}
.btn:hover{border-color:var(--bd2); color:var(--ink)}
#prog{position:fixed; top:0; left:var(--sb); right:0; height:2px; z-index:60;
  background:linear-gradient(90deg,var(--acc),var(--acc2)); width:0; transition:width .1s}

/* ================================================================== sections */
section{padding:52px 0 8px; scroll-margin-top:60px}
section+section{border-top:1px solid var(--bd)}
h2{font-size:27px; line-height:1.22; margin:0 0 6px; letter-spacing:-.022em}
h2 .kicker{display:block; font:600 11px/1 var(--mono); letter-spacing:.14em;
  color:var(--acc); text-transform:uppercase; margin-bottom:11px}
h3{font-size:19px; margin:38px 0 10px; letter-spacing:-.012em; scroll-margin-top:60px}
h4{font-size:15.5px; margin:26px 0 7px; color:var(--ink)}
p{margin:0 0 15px}
.lede{font-size:17.5px; color:var(--ink2); line-height:1.62; margin-bottom:26px}
ul,ol{margin:0 0 15px; padding-left:24px}
li{margin:5px 0}
li>ul,li>ol{margin:5px 0}
a{color:var(--acc)}
strong{color:var(--ink); font-weight:650}
em{color:var(--ink)}
code{
  font:0.875em var(--mono); background:var(--bg3); border:1px solid var(--bd);
  border-radius:5px; padding:1px 5px; color:var(--ink);
}
hr{border:0; border-top:1px solid var(--bd); margin:34px 0}
.small{font-size:13.5px; color:var(--ink2)}
.muted{color:var(--ink3)}

/* ===================================================================== boxes */
.box{
  background:var(--bg2); border:1px solid var(--bd); border-radius:var(--rad);
  padding:16px 18px; margin:22px 0;
}
.box>:last-child{margin-bottom:0}
.box .bt{
  font:700 10.5px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink3); margin-bottom:9px; display:flex; align-items:center; gap:7px;
}
.box.key{border-left:3px solid var(--acc)}
.box.key .bt{color:var(--acc)}
.box.why{border-left:3px solid var(--acc2)}
.box.why .bt{color:var(--acc2)}
.box.trap{border-left:3px solid var(--bad)}
.box.trap .bt{color:var(--bad)}
.box.mark{border-left:3px solid var(--warn)}
.box.mark .bt{color:var(--warn)}
.box.deriv{background:var(--bg3)}

/* ====================================================================== math */
.eq{
  background:var(--bg3); border:1px solid var(--bd); border-radius:var(--rad);
  padding:16px 18px; margin:18px 0; overflow-x:auto;
  font:15px/1.9 var(--mono); text-align:center; color:var(--ink);
}
.eq .n{float:right; color:var(--ink3); font-size:12px}
.eq.left{text-align:left}
.vardef{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:14px 0;
  font-size:14px; align-items:baseline}
.vardef dt{font:14px var(--mono); color:var(--acc2); white-space:nowrap}
.vardef dd{margin:0; color:var(--ink2)}
sub,sup{font-size:.72em}

/* ====================================================================== code */
pre{
  background:var(--bg2); border:1px solid var(--bd); border-radius:var(--rad);
  padding:14px 16px; overflow-x:auto; margin:18px 0;
  font:12.9px/1.62 var(--mono); color:var(--ink);
}
pre code{background:none; border:0; padding:0; font-size:inherit}
.codehdr{
  display:flex; align-items:center; gap:9px; margin:20px 0 -18px;
  position:relative; z-index:2; padding:0 3px;
}
.codehdr .fn{font:11.5px var(--mono); color:var(--ink3)}
.codehdr .tag{
  font:600 9.5px/1 var(--mono); letter-spacing:.09em; text-transform:uppercase;
  padding:3px 6px; border-radius:4px; background:var(--bg3);
  border:1px solid var(--bd); color:var(--ink3);
}
.codehdr+pre{margin-top:22px}
/* token colours */
.k{color:#ff7bd0} .s{color:var(--acc2)} .c{color:var(--ink3); font-style:italic}
.n{color:#ffb454} .f{color:var(--acc)} .d{color:#c792ea}
html[data-theme="light"] .k{color:#b3008f} html[data-theme="light"] .d{color:#6f42c1}

/* ===================================================================== table */
.tw{overflow-x:auto; margin:20px 0}
table{border-collapse:collapse; width:100%; font-size:13.3px}
th,td{padding:7px 10px; text-align:left; border-bottom:1px solid var(--bd)}
th{
  background:var(--bg3); font-size:11px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink2); font-weight:700; white-space:nowrap; position:sticky; top:0;
}
td.num,th.num{text-align:right; font-family:var(--mono); font-size:12.6px; white-space:nowrap}
tbody tr:hover{background:var(--bg2)}
tr.hi{background:color-mix(in srgb,var(--acc) 11%,transparent)}
tr.hi td{font-weight:600}
.cap{font-size:12.5px; color:var(--ink3); margin:-10px 0 20px}
td.good{color:var(--good)} td.bad{color:var(--bad)} td.muted{color:var(--ink3)}
/* Confusion matrices read as a 2x2 grid, so the counts want to be large enough to
   compare at a glance rather than merely legible. */
table.cm td.num{font-size:16px; font-weight:600}
table.cm td:first-child{white-space:nowrap}
.chip{
  display:inline-block; padding:1px 7px; border-radius:20px; font:600 11px var(--mono);
  border:1px solid var(--bd); background:var(--bg3); color:var(--ink2);
}
.chip.g{color:var(--good); border-color:color-mix(in srgb,var(--good) 40%,var(--bd))}
.chip.b{color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%,var(--bd))}
.chip.w{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 40%,var(--bd))}

/* ================================================================ interactive */
.widget{
  background:var(--bg2); border:1px solid var(--bd2); border-radius:var(--rad);
  padding:17px 19px; margin:24px 0; box-shadow:var(--shadow);
}
.widget .wt{
  font:700 10.5px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase;
  color:var(--acc); margin-bottom:4px;
}
.widget .wd{font-size:13.2px; color:var(--ink2); margin:0 0 15px}
.ctrl{display:flex; align-items:center; gap:12px; margin:11px 0; flex-wrap:wrap}
.ctrl label{font-size:12.5px; color:var(--ink2); min-width:132px; font-family:var(--mono)}
.ctrl input[type=range]{flex:1; min-width:150px; accent-color:var(--acc); height:18px}
.ctrl .val{font:13px var(--mono); color:var(--acc2); min-width:76px; text-align:right}
.readout{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr));
  gap:9px; margin-top:15px;
}
.ro{background:var(--bg3); border:1px solid var(--bd); border-radius:8px; padding:9px 11px}
.ro .l{font-size:10.5px; letter-spacing:.055em; text-transform:uppercase; color:var(--ink3)}
.ro .v{font:17px var(--mono); color:var(--ink); margin-top:3px; line-height:1.2}
.ro.acc .v{color:var(--acc2)} .ro.bad .v{color:var(--bad)} .ro.good .v{color:var(--good)}
svg.chart{display:block; width:100%; height:auto; overflow:visible}
svg text{font:11px var(--sans); fill:var(--ink3)}
svg .axis{stroke:var(--bd2); stroke-width:1}
svg .grid{stroke:var(--bd); stroke-width:1; stroke-dasharray:2 3}
svg .lbl{fill:var(--ink2); font-size:11px}
.seg{display:inline-flex; border:1px solid var(--bd); border-radius:7px; overflow:hidden}
.seg button{
  background:var(--bg3); border:0; border-right:1px solid var(--bd); color:var(--ink3);
  padding:5px 11px; font:12px var(--sans); cursor:pointer;
}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc); color:#fff; font-weight:600}

/* Quiz rows: the verdict is hidden until a button is pressed, so the answer cannot be
   read by accident while scrolling past. The left border carries the result colour. */
.lq{border:1px solid var(--bd); border-left:3px solid var(--bd2); border-radius:8px;
    background:var(--bg3); padding:12px 14px; margin:11px 0}
.lq p.s{margin:0 0 10px; font-size:14.5px; color:var(--ink)}
.lq .btns{display:flex; gap:7px}
.lq .btns button{
  background:var(--bg); border:1px solid var(--bd2); color:var(--ink2); cursor:pointer;
  padding:4px 13px; border-radius:6px; font:600 12px var(--sans);
}
.lq .btns button:hover{border-color:var(--acc); color:var(--ink)}
.lq .x{display:none; margin-top:11px; padding-top:11px; border-top:1px solid var(--bd);
       font-size:14px; color:var(--ink2); line-height:1.65}
.lq.done .x{display:block} .lq.done .btns{display:none}
.lq.done.leak{border-left-color:var(--bad)} .lq.done.fine{border-left-color:var(--good)}
.lq .mark{font:600 12px var(--mono); margin-left:9px}
.lq .mark.ok{color:var(--good)} .lq .mark.no{color:var(--bad)}

/* ================================================================== collapse */
details{
  background:var(--bg2); border:1px solid var(--bd); border-radius:var(--rad);
  margin:18px 0; overflow:hidden;
}
details>summary{
  cursor:pointer; padding:12px 16px; font-size:14px; font-weight:600;
  list-style:none; display:flex; align-items:center; gap:9px; color:var(--ink);
}
details>summary::-webkit-details-marker{display:none}
details>summary::before{
  content:"▸"; color:var(--acc); font-size:11px; transition:transform .15s;
  display:inline-block;
}
details[open]>summary::before{transform:rotate(90deg)}
details>summary:hover{background:var(--bg3)}
details .dbody{padding:2px 17px 15px; border-top:1px solid var(--bd)}
details .dbody>:first-child{margin-top:14px}
details .dbody>:last-child{margin-bottom:0}
details.q>summary{font-weight:500; font-size:14.5px}
details.q>summary::before{content:"?"; font:700 12px var(--mono)}

/* ===================================================================== misc */
figure{margin:24px 0}
figure img{
  width:100%; border:1px solid var(--bd); border-radius:var(--rad);
  background:#fff; display:block;
}
figcaption{font-size:12.5px; color:var(--ink3); margin-top:9px; line-height:1.5}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:13px}
@media(max-width:920px){
  #sidebar{display:none} .wrap{padding:0 20px} #topbar{padding:9px 20px}
  #prog{left:0} .grid2,.grid3{grid-template-columns:1fr}
}
.ladder-rung{display:flex; align-items:center; gap:10px; margin:4px 0; font-size:13px}
.ladder-rung .bar{height:17px; background:var(--acc); border-radius:3px; min-width:2px}
.flow{display:flex; flex-direction:column; gap:7px; margin:20px 0}
.flow .step{
  display:flex; gap:12px; align-items:flex-start; padding:11px 13px;
  background:var(--bg2); border:1px solid var(--bd); border-radius:9px;
}
.flow .step .i{
  flex:0 0 24px; height:24px; border-radius:50%; background:var(--bg3);
  border:1px solid var(--bd2); display:grid; place-items:center;
  font:700 11.5px var(--mono); color:var(--acc);
}
.flow .step .t{flex:1; font-size:13.6px; line-height:1.55}
.flow .step .t b{display:block; margin-bottom:2px; font-size:14px}
.flow .step.danger{border-color:color-mix(in srgb,var(--bad) 45%,var(--bd))}
.flow .step.danger .i{color:var(--bad)}
mark{background:color-mix(in srgb,var(--warn) 32%,transparent); color:var(--ink);
  padding:0 3px; border-radius:3px}
kbd{font:11.5px var(--mono); background:var(--bg3); border:1px solid var(--bd2);
  border-bottom-width:2px; border-radius:4px; padding:1px 5px}
.toctop{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:11px;
  margin:28px 0;
}
.toctop a{
  display:block; padding:13px 15px; background:var(--bg2); border:1px solid var(--bd);
  border-radius:var(--rad); text-decoration:none; color:var(--ink);
}
.toctop a:hover{border-color:var(--acc)}
.toctop a .n{font:11px var(--mono); color:var(--acc); letter-spacing:.1em}
.toctop a .t{display:block; font-weight:650; margin:5px 0 3px; font-size:14.5px}
.toctop a .d{display:block; font-size:12.3px; color:var(--ink3); line-height:1.45}
</style>
</head>
<body>
<div id="prog"></div>
<div id="shell">
<aside id="sidebar">
  <div class="brand">
    <h1>XGBoost · Credit Defaults</h1>
    <p>3031ICT Data Mining — Phase 2<br>Complete study guide</p>
  </div>
  <div class="navsearch"><input id="navq" type="search" placeholder="Filter sections…" autocomplete="off"></div>
  <nav id="nav"></nav>
</aside>
<div id="main">
<div id="topbar">
  <div id="crumb">Orientation</div>
  <button class="btn" id="expandall">Expand all</button>
  <button class="btn" id="theme">Light</button>
</div>
<div class="wrap">
